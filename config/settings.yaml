  version: "1.0.0"
  environment: "simulation_live"

trading:
  mode: "paper_simulation"
  initial_capital_usd: 1000.0  # 👈 AQUÍ PONES EL DINERO VIRTUAL QUE QUIERAS
  base_currency: "USD"

universe:
  # Puedes usar criptos (MEXC) o ETFs (Yahoo Finance)
  # Ejemplo Cripto: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
  # Ejemplo ETFs: ["SPY", "QQQ", "GLD"]
